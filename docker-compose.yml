# 메가헤르츠 API 서버 + 수집기
#   docker compose up -d --build
#   docker compose run --rm api node scripts/migrate.js   (처음 한 번, 스키마 바뀔 때마다)

x-app: &app
  build: .
  image: mhz-be:latest
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *app
    environment:
      HOST: 0.0.0.0
      PORT: 4100
    # 호스트의 nginx 만 접근하도록 127.0.0.1 에만 연다. 포트가 겹치면 .env 의 MHZ_PORT 로 바꾼다
    ports:
      - "127.0.0.1:${MHZ_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  crawler:
    <<: *app
    command: ["node", "src/crawl/scheduler.js"]

# [대안] ALB 대신 DailyNews 서버 nginx 로 직접 받을 때만 쓴다(기본 구성은 README 3번의 ALB 규칙).
# 이 경우 DNS 를 이 서버 공인 IP 로 바꿔야 한다.
#   1) /etc/nginx/conf.d/mhz.conf 로 복사 → sudo nginx -t && sudo systemctl reload nginx
#   2) sudo certbot --nginx -d mhz.api.adpilot.co.kr   (443 블록과 http→https 리다이렉트를 certbot 이 추가)
# nginx 가 컨테이너라면 proxy_pass 를 http://host.docker.internal:4100 등 그 환경에 맞게 바꾼다.
server {
    listen 80;
    server_name mhz.api.adpilot.co.kr;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
